# Cargo workspace for the cntrl agent and its shared crates.
# Bridge (apps/bridge/src-tauri) stays its own workspace. Without the exclude,
# its build fails with "current package believes it's in a workspace when it's not".
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["apps/bridge/src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/azaek/cntrl"
homepage = "https://cntrl.pw"
publish = false

[workspace.dependencies]
cntrl-protocol = { path = "crates/cntrl-protocol" }
cntrl-host = { path = "crates/cntrl-host" }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
