# Checks the Rust workspace (the cntrl agent and its crates) and the protocol
# package generated from it. Bridge builds in its own workflow; the last Rust
# step only proves the root workspace doesn't capture apps/bridge/src-tauri.
name: Agent

on:
    push:
        branches: [main]
        paths:
            - "Cargo.toml"
            - "Cargo.lock"
            - ".cargo/**"
            - "clippy.toml"
            - "crates/**"
            - "xtask/**"
            - "protocol/**"
            - "testdata/**"
            - "packages/protocol/**"
            - ".github/workflows/agent.yml"
    pull_request:
        paths:
            - "Cargo.toml"
            - "Cargo.lock"
            - ".cargo/**"
            - "clippy.toml"
            - "crates/**"
            - "xtask/**"
            - "protocol/**"
            - "testdata/**"
            - "packages/protocol/**"
            - ".github/workflows/agent.yml"

env:
    CARGO_TERM_COLOR: always

jobs:
    rust:
        # Pinned: ubuntu-latest becomes 26.04 on 2026-10-19; move on purpose.
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache
              uses: swatinem/rust-cache@v2

            - name: Format
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Test
              run: cargo test --workspace

            - name: Generated files are current
              run: cargo xtask codegen --check

            - name: Bridge stays its own workspace
              run: cargo metadata --manifest-path apps/bridge/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null

    windows:
        # The Windows port (D58): clippy and the tests on x64 and on ARM64,
        # each on its own hardware, with the MSVC toolchain.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: windows-2025
                      target: x86_64-pc-windows-msvc
                    - runner: windows-11-arm
                      target: aarch64-pc-windows-msvc
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
                  components: clippy

            - name: Cache
              uses: swatinem/rust-cache@v2

            - name: Clippy
              run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

            - name: Test
              run: cargo test --workspace --target ${{ matrix.target }}

            - name: GPUs read the same as a virtual account
              # The agent reads GPUs as its service's virtual account, with
              # no administrator rights (D59). The survey test lists what
              # reads of each display adapter: run it as an administrator,
              # then as the process of a service set up as the agent's is,
              # and compare. The test isn't a service, so the start fails
              # once it's done, which is expected; a service has no output,
              # so it writes the file the service's environment names.
              shell: pwsh
              run: |
                  $test = cargo test -p cntrl-host --target ${{ matrix.target }} --no-run --message-format=json |
                      ConvertFrom-Json |
                      Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'cntrl_host' -and $_.profile.test } |
                      Select-Object -ExpandProperty executable -First 1
                  $dir = Join-Path $env:RUNNER_TEMP 'as-service'
                  New-Item -ItemType Directory -Force -Path $dir | Out-Null
                  icacls $dir /grant '*S-1-5-6:(OI)(CI)M' | Out-Null
                  Copy-Item $test "$dir\test.exe"
                  $survey = 'windows::gpu::tests::surveys_every_display_adapter'
                  $env:CNTRL_GPU_SURVEY = "$dir\admin.txt"
                  & "$dir\test.exe" $survey --exact
                  if ($LASTEXITCODE -ne 0) { Write-Error 'the survey failed as an administrator'; exit 1 }
                  Remove-Item Env:CNTRL_GPU_SURVEY
                  sc.exe create cntrl-gpu-test binPath= "$dir\test.exe $survey --exact" obj= 'NT SERVICE\cntrl-gpu-test'
                  sc.exe sidtype cntrl-gpu-test unrestricted
                  sc.exe privs cntrl-gpu-test SeChangeNotifyPrivilege
                  New-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Services\cntrl-gpu-test -Name Environment -PropertyType MultiString -Value "CNTRL_GPU_SURVEY=$dir\service.txt" | Out-Null
                  sc.exe start cntrl-gpu-test
                  $deadline = (Get-Date).AddMinutes(2)
                  while (-not (Select-String -Path "$dir\service.txt" -Pattern '^survey: end' -Quiet -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
                  sc.exe delete cntrl-gpu-test
                  $lines = { param($file) Get-Content $file -ErrorAction SilentlyContinue | Where-Object { $_ -match '^(adapter|gpus): ' } }
                  $admin = (& $lines "$dir\admin.txt") -join "`n"
                  $service = (& $lines "$dir\service.txt") -join "`n"
                  'As a virtual account:'; Get-Content "$dir\service.txt" -ErrorAction SilentlyContinue
                  if (-not (Select-String -Path "$dir\service.txt" -Pattern '^survey: end' -Quiet -ErrorAction SilentlyContinue)) { Write-Error 'the survey never finished as a virtual account'; exit 1 }
                  if (Select-String -Path "$dir\service.txt" -Pattern '^problem: ' -Quiet) { Write-Error 'the survey found problems as a virtual account'; exit 1 }
                  if (-not $admin -or $admin -ne $service) { Write-Error 'a virtual account reads differently from an administrator'; exit 1 }
                  exit 0

    protocol-types:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile --filter "@cntrl-pw/protocol..."

            - name: Type-check the generated package
              run: pnpm --filter @cntrl-pw/protocol check-types
