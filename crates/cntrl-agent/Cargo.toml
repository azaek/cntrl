[package]
name = "cntrl-agent"
description = "The cntrl agent: a headless, system-level server-management agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# The agent runs on Unix only for now; elsewhere the binary builds and refuses
# to run, so `cargo build --workspace` works on every developer machine.
[target.'cfg(unix)'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
cntrl-host.workspace = true
cntrl-protocol.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
listenfd = "1"
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
sd-notify = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# A private working directory for `cntrl update` (D41).
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dev-dependencies]
cntrl-host = { workspace = true, features = ["test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
