[package]
name = "cntrl-host"
description = "Host capabilities for the cntrl agent, with a backend per OS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# Scripted backends, for tests in crates that use the traits.
test-util = []

[dependencies]
cntrl-protocol.workspace = true
# journalctl's JSON lines, for logs (angle 11).
serde_json.workspace = true
# Parsing only, no OS calls, so the Linux backend builds and tests anywhere.
procfs-core = { version = "0.18", default-features = false }

# The process table on both (angle 06), plus host stats and system info on
# macOS, as the research recommends for non-Linux hosts. rustix signals
# processes, through a pidfd on Linux.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Power actions run a command or a D-Bus call from async code (angle 10).
tokio = { version = "1", default-features = false, features = ["process", "rt"] }
rustix = { version = "1.1", default-features = false, features = ["std", "process", "event", "fs"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }

# Disks, network and temperatures on macOS (angle 09); diskutil's and
# ioreg's property lists for the Storage tab (angle 13).
[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "user", "disk", "network", "component"] }
plist = { version = "1", default-features = false }

# systemd over D-Bus, for services; interfaces' addresses for the Network
# tab (angle 13), which sysinfo reads with getifaddrs.
[target.'cfg(target_os = "linux")'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "user", "network"] }
futures-util = "0.3"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26200", default-features = false, features = ["systemd1", "login1", "zbus-async-tokio"] }

# Host stats, system info and the process table on Windows, and what sysinfo
# can't do there: naming service accounts, stopping a process without
# running taskkill, CPU time and the registry (D58).
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "user", "disk", "network"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Nvme",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
